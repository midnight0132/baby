<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>For Dipshikha 💘</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4 40%, #fbc2eb 70%, #a18cd1);
    background-size: 300% 300%;
    animation: bgShift 12s ease infinite;
    color: #5a1a3a;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  @keyframes bgShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* floating hearts layer */
  #hearts { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .heart {
    position: absolute;
    bottom: -40px;
    animation: floatUp linear forwards;
    opacity: .85;
    user-select: none;
  }
  @keyframes floatUp {
    to { transform: translateY(-115vh) rotate(40deg); opacity: 0; }
  }

  /* card */
  .card {
    position: relative;
    z-index: 2;
    width: min(92vw, 520px);
    padding: 44px 32px 40px;
    text-align: center;
    background: rgba(255, 255, 255, 0.35);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius: 28px;
    box-shadow: 0 20px 60px rgba(180, 40, 100, 0.25);
    animation: pop .8s cubic-bezier(.2, 1.4, .4, 1);
  }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .scene { display: none; }
  .scene.active { display: block; animation: fadeIn .7s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .big-emoji { font-size: 72px; display: inline-block; animation: beat 1.2s infinite; }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.2); }
    30% { transform: scale(1); }
    45% { transform: scale(1.15); }
  }

  h1 {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(2.2rem, 8vw, 3.2rem);
    margin: 10px 0 8px;
    color: #c2185b;
    text-shadow: 0 2px 10px rgba(255, 255, 255, .6);
  }
  p { font-weight: 300; font-size: 1.05rem; line-height: 1.7; margin-bottom: 22px; }
  .typed { min-height: 5.2em; }

  button {
    font-family: inherit;
    border: none;
    cursor: pointer;
    border-radius: 50px;
    font-weight: 600;
    transition: transform .2s, box-shadow .2s;
  }
  .btn-main {
    padding: 14px 34px;
    font-size: 1.05rem;
    color: #fff;
    background: linear-gradient(45deg, #ff416c, #ff4b2b);
    box-shadow: 0 8px 22px rgba(255, 65, 108, .45);
  }
  .btn-main:hover { transform: translateY(-3px) scale(1.05); }

  /* Larger boundary box for the buttons */
  .answers {
    position: relative;
    display: flex;
    gap: 18px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 10px;
    height: 150px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 20px;
    border: 1px dashed rgba(194, 24, 91, 0.3);
  }
  #yes {
    padding: 16px 44px;
    font-size: 1.2rem;
    color: #fff;
    background: linear-gradient(45deg, #11998e, #38ef7d);
    box-shadow: 0 8px 22px rgba(17, 153, 142, .45);
    transition: transform .25s;
    position: relative;
    z-index: 2;
  }
  #yes:hover { transform: scale(1.1); }
  #no {
    padding: 12px 28px;
    font-size: 1rem;
    color: #fff;
    background: #8e8e9a;
    position: absolute;
    z-index: 5;
    transition: left 0.15s ease, top 0.15s ease;
  }

  .love-letter {
    background: rgba(255, 255, 255, .55);
    border-radius: 18px;
    padding: 18px 20px;
    font-family: 'Dancing Script', cursive;
    font-size: 1.45rem;
    line-height: 1.6;
    color: #8e1b4f;
    margin-bottom: 20px;
  }

  canvas#confetti { position: fixed; inset: 0; z-index: 10; pointer-events: none; }

  #musicBtn {
    position: fixed; top: 16px; right: 16px; z-index: 20;
    width: 46px; height: 46px; font-size: 1.3rem;
    background: rgba(255, 255, 255, .6);
    box-shadow: 0 4px 14px rgba(0, 0, 0, .15);
  }
</style>
</head>
<body>

<div id="hearts"></div>
<canvas id="confetti"></canvas>
<button id="musicBtn" title="Toggle music">🔇</button>

<div class="card">

  <!-- Scene 1: intro -->
  <section class="scene active" id="s1">
    <div class="big-emoji">💌</div>
    <h1>Hey <span class="name"></span>...</h1>
    <p>I made something special just for you.<br />Will you open it?</p>
    <button class="btn-main" id="openBtn">Open it 💖</button>
  </section>

  <!-- Scene 2: typed message -->
  <section class="scene" id="s2">
    <div class="big-emoji">✨</div>
    <h1>Dear <span class="name"></span></h1>
    <p class="typed" id="typed"></p>
    <button class="btn-main" id="nextBtn" style="display:none">Continue 💕</button>
  </section>

  <!-- Scene 3: the question -->
  <section class="scene" id="s3">
    <div class="big-emoji" id="questionEmoji">🥺</div>
    <h1><span class="name"></span>, will you be my girlfriend?</h1>
    <p id="questionText">Think carefully... my heart is in your hands.</p>
    <div class="answers" id="answers">
      <button id="yes">Yes 💘</button>
      <button id="no">No 💔</button>
    </div>
  </section>

  <!-- Scene 4: celebration -->
  <section class="scene" id="s4">
    <div class="big-emoji">🥰</div>
    <h1>She said YES!!! 🎉</h1>
    <div class="love-letter" id="loveLetter"></div>
    <p>Best decision ever, <span class="name"></span>.<br />Get ready for a lifetime of smiles 💞</p>
    <button class="btn-main" id="againBtn">Celebrate again 🎆</button>
  </section>

</div>

<script>
/* ============ CONFIG — edit these ============ */
const CONFIG = {
  crushName: "Dipshikha",        
  yourName:  "Your Name",       
  message:
    "From the moment I met you, my days got brighter and my heart got louder. " +
    "You make ordinary moments feel magical, and I can't stop smiling when I think of you. " +
    "So I have just one little question for you...",
  finalNote:
    "You just made me the happiest person alive. I promise to make you smile every single day. — "
};
/* ============================================= */

const params = new URLSearchParams(location.search);
const crush = params.get("name") || CONFIG.crushName;
document.title = "For " + crush + " 💘";
document.querySelectorAll(".name").forEach(el => el.textContent = crush);

/* ---------- scene helper ---------- */
function show(id) {
  document.querySelectorAll(".scene").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ---------- floating hearts ---------- */
const heartsLayer = document.getElementById("hearts");
const emojis = ["💖", "💗", "💕", "💘", "❤️", "💞", "🌸"];
function spawnHeart() {
  const h = document.createElement("div");
  h.className = "heart";
  h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
  h.style.left = Math.random() * 100 + "vw";
  h.style.fontSize = 14 + Math.random() * 30 + "px";
  h.style.animationDuration = 6 + Math.random() * 7 + "s";
  heartsLayer.appendChild(h);
  setTimeout(() => h.remove(), 13000);
}
setInterval(spawnHeart, 350);
for (let i = 0; i < 12; i++) setTimeout(spawnHeart, i * 150);

/* ---------- scene 1 -> 2 (typewriter) ---------- */
document.getElementById("openBtn").onclick = () => {
  show("s2");
  const el = document.getElementById("typed");
  const btn = document.getElementById("nextBtn");
  let i = 0;
  (function type() {
    el.textContent = CONFIG.message.slice(0, i++);
    if (i <= CONFIG.message.length) setTimeout(type, 32);
    else btn.style.display = "inline-block";
  })();
};
document.getElementById("nextBtn").onclick = () => {
  show("s3");
  setTimeout(resetNoButtonPosition, 50);
};

/* ---------- the bounded runaway "No" button ---------- */
const noBtn  = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const qText  = document.getElementById("questionText");
const qEmoji = document.getElementById("questionEmoji");
const answersContainer = document.getElementById("answers");

const noMessages = [
  "Are you sure? 🥺",
  "Think again... 💭",
  "Pretty please? 🥹",
  "My heart is breaking 💔",
  "Don't do this to me 😭",
  "I'll bring chocolates! 🍫",
  "Just say yes already 😤💕"
];
const sadEmojis = ["🥺", "😢", "😭", "💔", "🥹", "😿"];
let noCount = 0, yesScale = 1;

function resetNoButtonPosition() {
  noBtn.style.left = "180px";
  noBtn.style.top = "50px";
}

function dodge() {
  noCount++;
  qText.textContent = noMessages[Math.min(noCount - 1, noMessages.length - 1)];
  qEmoji.textContent = sadEmojis[noCount % sadEmojis.length];

  // grow the Yes button each time
  yesScale = Math.min(yesScale + 0.15, 2.0);
  yesBtn.style.transform = `scale(${yesScale})`;

  // Larger boundary calculations inside the .answers container box
  const containerRect = answersContainer.getBoundingClientRect();
  const btnRect = noBtn.getBoundingClientRect();

  const maxX = containerRect.width - btnRect.width - 15;
  const maxY = containerRect.height - btnRect.height - 10;

  const randomX = Math.max(10, Math.floor(Math.random() * maxX));
  const randomY = Math.max(10, Math.floor(Math.random() * maxY));

  noBtn.style.left = randomX + "px";
  noBtn.style.top  = randomY + "px";
}

noBtn.addEventListener("mouseenter", dodge);
noBtn.addEventListener("touchstart", e => { e.preventDefault(); dodge(); }, { passive: false });
noBtn.addEventListener("click", dodge);

/* ---------- YES! ---------- */
yesBtn.onclick = () => {
  noBtn.style.display = "none";
  document.getElementById("loveLetter").textContent = CONFIG.finalNote + CONFIG.yourName + " 💌";
  show("s4");
  blastConfetti();
  for (let i = 0; i < 30; i++) setTimeout(spawnHeart, i * 60);
};
document.getElementById("againBtn").onclick = blastConfetti;

/* ---------- confetti ---------- */
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");
function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
resize(); addEventListener("resize", resize);

let pieces = [], running = false;
function blastConfetti() {
  const colors = ["#ff416c", "#ff4b2b", "#f9d423", "#38ef7d", "#4facfe", "#f093fb", "#fff"];
  for (let i = 0; i < 220; i++) {
    pieces.push({
      x: innerWidth / 2, y: innerHeight / 2,
      vx: (Math.random() - 0.5) * 22,
      vy: Math.random() * -20 - 4,
      size: 6 + Math.random() * 8,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
      life: 160 + Math.random() * 80,
      heart: Math.random() < 0.3
    });
  }
  if (!running) { running = true; requestAnimationFrame(tick); }
}
function tick() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  pieces.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.35; p.vx *= 0.99;
    p.rot += p.vr; p.life--;
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.globalAlpha = Math.max(p.life / 80, 0);
    ctx.fillStyle = p.color;
    if (p.heart) { ctx.font = p.size * 2 + "px serif"; ctx.fillText("❤", 0, 0); }
    else ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
    ctx.restore();
  });
  pieces = pieces.filter(p => p.life > 0 && p.y < canvas.height + 50);
  if (pieces.length) requestAnimationFrame(tick);
  else { running = false; ctx.clearRect(0, 0, canvas.width, canvas.height); }
}

/* ---------- optional soft music (Web Audio, no files needed) ---------- */
let audioCtx, musicOn = false, musicTimer;
const melody = [523.25, 659.25, 783.99, 659.25, 698.46, 587.33, 659.25, 523.25];
function playNote(freq, t) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = "sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.08, t + 0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + 1);
}
function loopMusic() {
  const now = audioCtx.currentTime;
  melody.forEach((f, i) => playNote(f, now + i * 0.6));
  musicTimer = setTimeout(loopMusic, melody.length * 600);
}
document.getElementById("musicBtn").onclick = function () {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  musicOn = !musicOn;
  this.textContent = musicOn ? "🎵" : "🔇";
  if (musicOn) { audioCtx.resume(); loopMusic(); }
  else clearTimeout(musicTimer);
};
</script>
</body>
</html>
